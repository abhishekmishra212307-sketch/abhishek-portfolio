<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-container">
        <h1>My To-Do List</h1>
        <button id="themeBtn"
        onclick="toggleTheme()"> Dark Mode</button>

        <div class="task-counter">
    <span>Total: <b id="totalTasks">0</b></span>
    <span>Completed: <b id="completedTasks">0</b></span>
    <span>Pending: <b id="pendingTasks">0</b></span>
</div>

        <div class="input-box">
            <input type="text" id="taskInput" placeholder="Enter a task">
            <button onclick="addTask()">Add</button>
        </div>
        <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search task..." oninput="searchTasks()">
</div>
<div class="filter-buttons">
    <button onclick="filterTasks('all')">All</button>
    <button onclick="filterTasks('pending')">Pending</button>
    <button onclick="filterTasks('completed')">Completed</button>
    <button onclick="clearAllTasks()">Clear All Tasks</button>
</div>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
