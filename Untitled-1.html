<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Janmashtami</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff3b0, #ffb347, #ff7043);
        }

        .card {
            width: 90%;
            max-width: 600px;
            padding: 30px;
            border-radius: 25px;
            background: rgba(255,255,255,0.25);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        img {
            width: 280px;
            max-width: 90%;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            color: #7b1b00;
            margin-bottom: 10px;
        }

        h2 {
            color: #4e2600;
            font-size: 25px;
        }

        p {
            margin-top: 15px;
            font-size: 20px;
            color: #5a2500;
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- Krishna Image -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/Krishna_playing_flute.jpg/640px-Krishna_playing_flute.jpg"
             alt="Lord Krishna">

        <h1>🦚 Happy Janmashtami 🦚</h1>

        <h2>🙏 Jai Shri Krishna 🙏</h2>

        <p>✨ May Lord Krishna bless you with happiness, peace and success ✨</p>

        <p>💙 Radhe Radhe 💙</p>

    </div>

</body>
</html>
