<!DOCTYPE html>
<html>
<head>
    <title>My Business Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            padding: 60px 20px;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        section {
            padding: 40px 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to Our Business</h1>

        <p>
            We provide quality services with simple,
            professional and reliable solutions.
        </p>

        <a href="#contact" class="btn">Contact Us</a>
    </header>

    <section>
        <h2>Our Services</h2>

        <p>Website Development</p>
        <p>Website Design</p>
        <p>Responsive Websites</p>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>

        <p>Let's work together on your next project.</p>

        <a href="mailto:your-email@gmail.com" class="btn">
            Contact Us
        </a>
    </section>

</body>
</html>
